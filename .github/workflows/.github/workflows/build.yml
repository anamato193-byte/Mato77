name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder
        id: find
        run: |
          F=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts not found. Files in repo:"
            find . -maxdepth 3 -not -path "./.git/*" | head -50
            exit 1
          fi
          D=$(dirname "$F")
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SmartAppLocker-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/release/*.apk
